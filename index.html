if(!SBON)try{const sv=JSON.parse(localStorage.getItem('thaco_acc')||'null');if(sv){(sv.U||[]).forEach(x=>{const i=USERS.findIndex(y=>y.u===x.u);if(i<0)USERS.push(x);else USERS[i]=x});(sv.T||[]).forEach(x=>{if(!TV.some(y=>y.u===x.u))TV.push(x)})}}catch(e){}
const h=location.hash.slice(1);if(V[h])view=h;

if(BOOT)rpc('app_me',{p_token:TK}).then(u=>{if(u)return enter(u);TK=null;try{localStorage.removeItem('thaco_tk')}catch(x){}BOOT=false;render()}).catch(e=>{BOOT=false;if(/AUTH/.test(e.message||'')){TK=null;try{localStorage.removeItem('thaco_tk')}catch(x){}}render();$('#le').textContent=errMsg(e)});
